<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой макет из фигни</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 40px;
            display: flex;
            
            
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 24px;



        }

        .column {
            display: flex;
            flex-direction: column;

            gap: 24px;

        }

        .row {
            display: flex;


            flex-direction: row;
            gap: 24px;
        }

        .block {
            background-color: #ffffff;
            border-radius: 24px;
        }

        .combined-left-center {

            display: flex;
            flex-direction: column;

            gap: 24px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="combined-left-center">
            <div style="display: flex; flex-direction: row; gap: 24px;">
                <div class="column">

                    <div class="block" style="width: 453px; height: 673px;"></div>
                    
                    <div class="block" style="width: 453px; height: 332px;"></div>

                </div>

                <div class="column">
                    <div class="row">
                        <div class="block" style="width: 480px; height: 403px;"></div>

                        <div class="block" style="width: 505px; height: 403px;"></div>
                    </div>
                    <div class="block" style="width: 1009px; height: 607px;"></div>
                </div>
            </div>

            <div class="row">

                <div class="block" style="width: 955px; height: 408px;"></div>

                <div class="block" style="width: 505px; height: 408px;"></div>

            </div>
        </div>

        <div class="column">
            <div class="block" style="width: 457px; height: 751px;"></div>
            <div class="block" style="width: 457px; height: 688px;"></div>

        </div>

    </div>

</body>
</html>
